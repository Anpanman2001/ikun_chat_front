name: chatfront
description: "ikun 真爱粉专属，黑子勿进"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  socket_io_client: ^3.0.2
  http: ^1.2.2
  uuid: ^3.0.7
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4
  flutter_launcher_icons: ^0.14.1
  lottie: ^3.1.0
  forui: ^0.21.3
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/kunkun.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ikunapp.png"
